<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        #queryInput {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            border: none;
            outline: none;
            margin-top: 20px;
        }
        #sendBtn {
            display: inline-block;
            margin-top: 20px;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            background: linear-gradient(90deg, #9a4dff, #5864ff);
            border: none;
            color: #fff;
            transition: background 0.3s ease;
        }
        #sendBtn:hover {
            background: linear-gradient(90deg, #8560ff, #4b58e6);
        }
        #loader, #successMsg {
            display: none;
            margin-top: 20px;
        }
        #loader {
            font-size: 18px;
        }
        #loader::before {
            content: "";
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #fff;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #successMsg {
            color: #4caf50;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div>
        <h1>🎨 Generatore Immagini NORA</h1>
        <input type="text" id="queryInput" placeholder="Scrivi una parola o descrizione...">
        <button id="sendBtn">Genera e Invia su Telegram 🚀</button>
        <div id="loader">⏳ Sto cercando l'immagine perfetta...</div>
        <div id="successMsg">✅ Immagine inviata su Telegram!</div>
    </div>
    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            const queryInput = document.getElementById('queryInput');
            if (!queryInput.value.trim()) {
                alert('Scrivi una descrizione!');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const loader = document.getElementById('loader');
            const successMsg = document.getElementById('successMsg');

            sendBtn.style.display = 'none';
            loader.style.display = 'block';

            fetch('https://nnora.ai/api/teams/image-generator-telegram/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ params: { query: queryInput.value, caption: queryInput.value } })
            })
            .then(() => {
                loader.style.display = 'none';
                successMsg.style.display = 'block';
            })
            .catch(() => {
                loader.style.display = 'none';
                sendBtn.style.display = 'block';
                alert('Errore, riprova!');
            });
        });
    </script>
</body>
</html>
