<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 2.5em;
            margin: 0;
        }
        header p {
            font-size: 1.2em;
            color: #a855f7;
            margin-top: 10px;
        }
        .card {
            background-color: #1a1a2e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        #query-input {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        #search-btn {
            background: linear-gradient(45deg, #7c3aed, #a855f7);
            color: #ffffff;
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.5);
            transition: background 0.3s ease;
        }
        #search-btn:disabled {
            background: #7c3aed;
            cursor: not-allowed;
        }
        #loader {
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
        #loader div {
            border: 4px solid #7c3aed;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-container {
            display: none;
            text-align: center;
        }
        #error-msg {
            display: none;
            color: #f87171;
            font-size: 1.1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎨 Generatore Immagini NORA</h1>
        <p>Scrivi una parola, la GIF animata appare qui</p>
    </header>
    <div class="card">
        <input type="text" id="query-input" placeholder="Es: ferrari, orsetto rosa, leone, tramonto...">
        <button id="search-btn">Cerca Immagine 🔍</button>
    </div>
    <div id="loader">
        <div></div>
        <p>Sto cercando...</p>
    </div>
    <div id="result-container">
        <img id="result-image" src="" alt="Risultato GIF">
        <p id="result-caption"></p>
    </div>
    <p id="error-msg"></p>
    <script>
        const GIPHY_KEY = '9PVCdedRliZhYtOMX0n84rSYFLs8l5k0';

        function searchImage() {
          const query = document.getElementById('query-input').value.trim();
          if (!query) { alert('Scrivi una parola!'); return; }

          document.getElementById('loader').style.display='flex';
          document.getElementById('result-container').style.display='none';
          document.getElementById('error-msg').style.display='none';
          document.getElementById('search-btn').disabled=true;

          const url = 'https://api.giphy.com/v1/gifs/search?api_key=' + GIPHY_KEY + '&q=' + encodeURIComponent(query) + '&limit=1&rating=g&lang=it';

          fetch(url)
            .then(r => r.json())
            .then(data => {
              document.getElementById('loader').style.display='none';
              document.getElementById('search-btn').disabled=false;
              if (data.data && data.data.length > 0) {
                const gifUrl = data.data[0].images.original.url;
                const img = document.getElementById('result-image');
                img.src = gifUrl;
                document.getElementById('result-caption').textContent = '🖼️ ' + query;
                document.getElementById('result-container').style.display='block';
              } else {
                document.getElementById('error-msg').textContent='❌ Nessuna GIF trovata per: ' + query + '. Prova un altra parola!';
                document.getElementById('error-msg').style.display='block';
              }
            })
            .catch(err => {
              document.getElementById('loader').style.display='none';
              document.getElementById('search-btn').disabled=false;
              document.getElementById('error-msg').textContent='❌ Errore connessione: ' + err.message;
              document.getElementById('error-msg').style.display='block';
            });
        }

        document.getElementById('search-btn').addEventListener('click', searchImage);
        document.getElementById('query-input').addEventListener('keypress', function(e) {
          if(e.key==='Enter') searchImage();
        });
    </script>
</body>
</html>
