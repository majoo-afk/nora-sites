<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1a2744;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #222b3c;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #c9a84c;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #c9a84c;
            border-radius: 4px;
            background-color: #1a2744;
            color: #ffffff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #c9a84c;
            color: #1a2744;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b3903a;
        }
        .loader {
            display: none;
            margin-top: 20px;
        }
        .loader:after {
            content: " ";
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border-radius: 50%;
            border: 4px solid #c9a84c;
            border-color: #c9a84c transparent #c9a84c transparent;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-message {
            display: none;
            color: #c9a84c;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generatore Immagini NORA</h1>
        <input type="text" id="imageInput" placeholder="Scrivi una parola o descrizione...">
        <button id="generateButton">Genera e Invia su Telegram</button>
        <div class="loader" id="loader">Sto cercando l'immagine perfetta...</div>
        <div class="success-message" id="successMessage">Immagine inviata con successo!</div>
    </div>

    <script>
        document.getElementById('generateButton').addEventListener('click', function() {
            var query = document.getElementById('imageInput').value;
            if (query) {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('generateButton').style.display = 'none';

                fetch('/api/teams/image-generator-telegram/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ params: { query: query } })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('generateButton').style.display = 'block';
                });
            }
        });
    </script>
</body>
</html>
