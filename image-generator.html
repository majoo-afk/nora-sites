<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #queryInput {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            border: none;
            outline: none;
            margin-bottom: 20px;
        }
        #sendBtn {
            background: linear-gradient(45deg, #6a5acd, #8a2be2);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            outline: none;
            margin-bottom: 20px;
        }
        #loader {
            display: none;
            margin-bottom: 20px;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #statusMsg {
            display: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generatore Immagini NORA</h1>
        <input type="text" id="queryInput" placeholder="Scrivi una parola o descrizione..." />
        <button id="sendBtn">Genera e Invia su Telegram 🚀</button>
        <div id="loader">
            <div class="spinner"></div>
            <p>⏳ Sto cercando l'immagine perfetta...</p>
        </div>
        <div id="statusMsg"></div>
    </div>
    <script>
        const sendBtn = document.getElementById('sendBtn');
        const queryInput = document.getElementById('queryInput');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');

        sendBtn.addEventListener('click', () => {
            const query = queryInput.value.trim();
            if (!query) {
                alert('Scrivi una descrizione!');
                return;
            }
            sendBtn.style.display = 'none';
            loader.style.display = 'block';

            fetch('https://nnora.ai/api/teams/image-generator-telegram/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ params: { query: query, caption: query } })
            })
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#4ade80';
                statusMsg.textContent = '✅ Immagine inviata su Telegram!';
            })
            .catch(err => {
                loader.style.display = 'none';
                sendBtn.style.display = 'block';
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#f87171';
                statusMsg.textContent = '❌ Errore: ' + err.message;
            });
        });
    </script>
</body>
</html>
