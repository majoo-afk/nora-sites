<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #8a2387, #e94057, #f27121);
            -webkit-background-clip: text;
            color: transparent;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 1rem;
            background-color: #2e2e3e;
            color: #ffffff;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: #ffffff;
            background: linear-gradient(to right, #8a2387, #e94057, #f27121);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #loader {
            display: none;
            font-size: 1rem;
            margin-top: 20px;
        }
        #statusMsg {
            display: none;
            font-size: 1rem;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generatore Immagini NORA</h1>
        <h2>Scrivi una parola, NORA trova l'immagine e te la manda su Telegram</h2>
        <input type="text" id="queryInput" placeholder="Es: tramonto, leone, Ferrari...">
        <button id="sendBtn">Genera e Invia su Telegram 🚀</button>
        <div id="loader">
            <span class="spinner"></span>⏳ NORA sta cercando l'immagine perfetta...
        </div>
        <div id="statusMsg"></div>
    </div>
    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            var q = document.getElementById('queryInput').value.trim();
            if (!q) {
                alert('Scrivi una descrizione!');
                return;
            }
            document.getElementById('sendBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusMsg').style.display = 'none';
            fetch('https://nnora.ai/api/teams/image-generator-telegram/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({params: {query: q, caption: q}})
            }).then(function(r) {
                return r.json();
            }).then(function(d) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('sendBtn').style.display = 'block';
                document.getElementById('statusMsg').style.display = 'block';
                document.getElementById('statusMsg').style.color = '#4ade80';
                document.getElementById('statusMsg').textContent = '✅ Immagine inviata su Telegram!';
            }).catch(function(e) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('sendBtn').style.display = 'block';
                document.getElementById('statusMsg').style.display = 'block';
                document.getElementById('statusMsg').style.color = '#f87171';
                document.getElementById('statusMsg').textContent = '❌ Errore di connessione. Riprova.';
            });
        });
    </script>
</body>
</html>
