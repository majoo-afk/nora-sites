<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
        }
        h2 {
            font-size: 1.2em;
            color: #a855f7;
        }
        .card {
            background-color: #1a1a2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.5);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #loader {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #a855f7;
            margin-top: 20px;
        }
        #loader div {
            border: 4px solid rgba(124, 58, 237, 0.3);
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-container {
            display: none;
            text-align: center;
        }
        #error-msg {
            display: none;
            color: #f87171;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎨 Generatore Immagini NORA</h1>
        <h2>Scrivi una parola, l'immagine reale appare qui</h2>
    </header>
    <div class="card">
        <input type="text" id="query-input" placeholder="Es: ferrari, cavallo, leone, montagna...">
        <button id="search-btn">Cerca Immagine 🔍</button>
        <div id="loader">
            <div></div>
            <span>Sto cercando l'immagine...</span>
        </div>
        <div id="result-container">
            <img id="result-image" style="max-width:100%;border-radius:16px;box-shadow:0 8px 32px rgba(124,58,237,0.5);margin:20px 0">
            <p id="result-caption" style="font-size:1.3em;font-weight:bold;color:#a855f7;text-transform:capitalize"></p>
        </div>
        <p id="error-msg" style="font-size:1.1em"></p>
    </div>
    <script>
        function searchImage() {
            const query = document.getElementById('query-input').value.trim();
            if (!query) { alert('Scrivi una parola!'); return; }

            document.getElementById('loader').style.display='flex';
            document.getElementById('result-container').style.display='none';
            document.getElementById('error-msg').style.display='none';
            document.getElementById('search-btn').disabled=true;

            const url = 'https://en.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(query) + '&prop=pageimages&format=json&pithumbsize=800&origin=*';

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    const pages = data.query.pages;
                    const page = Object.values(pages)[0];
                    if (page && page.thumbnail && page.thumbnail.source) {
                        const imgUrl = page.thumbnail.source;
                        const img = document.getElementById('result-image');
                        img.onload = function() {
                            document.getElementById('loader').style.display='none';
                            document.getElementById('result-caption').textContent = '🖼️ ' + query;
                            document.getElementById('result-container').style.display='block';
                            document.getElementById('search-btn').disabled=false;
                        };
                        img.onerror = function() {
                            document.getElementById('loader').style.display='none';
                            document.getElementById('error-msg').textContent='❌ Immagine non caricabile per: ' + query;
                            document.getElementById('error-msg').style.display='block';
                            document.getElementById('search-btn').disabled=false;
                        };
                        img.src = imgUrl;
                    } else {
                        const searchUrl = 'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(query) + '&format=json&origin=*';
                        fetch(searchUrl)
                            .then(r => r.json())
                            .then(sd => {
                                if (sd.query.search && sd.query.search.length > 0) {
                                    const firstTitle = sd.query.search[0].title;
                                    const url2 = 'https://en.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(firstTitle) + '&prop=pageimages&format=json&pithumbsize=800&origin=*';
                                    fetch(url2)
                                        .then(r2 => r2.json())
                                        .then(d2 => {
                                            const p2 = Object.values(d2.query.pages)[0];
                                            if (p2 && p2.thumbnail && p2.thumbnail.source) {
                                                const img = document.getElementById('result-image');
                                                img.onload = function() {
                                                    document.getElementById('loader').style.display='none';
                                                    document.getElementById('result-caption').textContent = '🖼️ ' + query + ' (' + firstTitle + ')';
                                                    document.getElementById('result-container').style.display='block';
                                                    document.getElementById('search-btn').disabled=false;
                                                };
                                                img.src = p2.thumbnail.source;
                                            } else {
                                                document.getElementById('loader').style.display='none';
                                                document.getElementById('error-msg').textContent='❌ Nessuna immagine trovata per: ' + query + '. Prova in inglese!';
                                                document.getElementById('error-msg').style.display='block';
                                                document.getElementById('search-btn').disabled=false;
                                            }
                                        });
                                } else {
                                    document.getElementById('loader').style.display='none';
                                    document.getElementById('error-msg').textContent='❌ Nessun risultato per: ' + query;
                                    document.getElementById('error-msg').style.display='block';
                                    document.getElementById('search-btn').disabled=false;
                                }
                            });
                    }
                })
                .catch(err => {
                    document.getElementById('loader').style.display='none';
                    document.getElementById('error-msg').textContent='❌ Errore connessione: ' + err.message;
                    document.getElementById('error-msg').style.display='block';
                    document.getElementById('search-btn').disabled=false;
                });
        }

        document.getElementById('search-btn').addEventListener('click', searchImage);
        document.getElementById('query-input').addEventListener('keypress', function(e) {
            if(e.key==='Enter') searchImage();
        });
    </script>
</body>
</html>
