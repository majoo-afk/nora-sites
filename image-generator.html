<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Generatore Immagini NORA</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin: 0.5em 0;
            color: #ffffff;
        }

        h2 {
            font-size: 1.2em;
            color: #a855f7;
        }

        .card {
            background-color: #1a2744;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        input[type="text"] {
            width: calc(100% - 24px);
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            font-size: 1em;
            outline: none;
        }

        button {
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: #ffffff;
            font-size: 1em;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background 0.3s;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #loader {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid rgba(124, 58, 237, 0.2);
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result-container {
            display: none;
            text-align: center;
        }

        #error-msg {
            display: none;
            color: #f87171;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎨 Generatore Immagini NORA</h1>
        <h2>Scrivi una parola, l'immagine appare qui</h2>
    </header>

    <div class="card">
        <input type="text" id="query-input" placeholder="Es: ferrari, tramonto, leone, montagna...">
        <button id="search-btn">Cerca Immagine 🔍</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>Sto cercando l'immagine...</p>
    </div>

    <div id="result-container">
        <img id="result-image" alt="Risultato immagine">
        <p id="result-caption"></p>
    </div>

    <p id="error-msg"></p>

    <script>
        function searchImage() {
            const query = document.getElementById('query-input').value.trim();
            if (!query) { alert('Scrivi una parola!'); return; }
            document.getElementById('loader').style.display='flex';
            document.getElementById('result-container').style.display='none';
            document.getElementById('error-msg').style.display='none';
            document.getElementById('search-btn').disabled=true;

            const seed = encodeURIComponent(query);
            const img = document.getElementById('result-image');

            const imageUrl = 'https://source.unsplash.com/800x600/?' + seed + '&t=' + Date.now();

            img.onload = function() {
                document.getElementById('loader').style.display='none';
                document.getElementById('result-caption').textContent = '🖼️ ' + query;
                document.getElementById('result-container').style.display='block';
                document.getElementById('search-btn').disabled=false;
            };
            img.onerror = function() {
                document.getElementById('loader').style.display='none';
                document.getElementById('error-msg').textContent='❌ Nessuna immagine trovata per: ' + query;
                document.getElementById('error-msg').style.display='block';
                document.getElementById('search-btn').disabled=false;
            };
            img.src = imageUrl;
        }

        document.getElementById('search-btn').addEventListener('click', searchImage);
        document.getElementById('query-input').addEventListener('keypress', function(e) {
            if(e.key==='Enter') searchImage();
        });
    </script>
</body>
</html>
